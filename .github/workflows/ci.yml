name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s skill/srs-edge-learning/tests -v
      - name: Shipped examples validate
        run: |
          python skill/srs-edge-learning/scripts/learn.py validate skill/srs-edge-learning/examples/sample-questions.json --type questions
          python skill/srs-edge-learning/scripts/learn.py validate skill/srs-edge-learning/examples/sample-brief.json --type brief
      - name: Smoke the CLI end to end
        shell: bash
        env:
          LEARN_HOME: ${{ runner.temp }}/learn-home
        run: |
          L="python skill/srs-edge-learning/scripts/learn.py"
          $L setup
          $L restore skill/srs-edge-learning/examples/sample-topic.json
          $L status rust-ownership
          $L backup --out "$RUNNER_TEMP/b.zip"
          $L rename rust-ownership "Rust ownership (ci)"
          $L archive rust-ownership && $L topics --all && $L unarchive rust-ownership
          $L remove rust-ownership --yes && $L undelete rust-ownership
          $L export rust-ownership
