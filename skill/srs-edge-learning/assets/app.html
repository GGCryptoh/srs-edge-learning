<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SRS Edge Learning</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath d=%27M16 2 30 16 16 30 2 16z%27 fill=%27%232563eb%27/%3E%3C/svg%3E">
<style>
:root{--bg:#f6f7f9;--fg:#15171b;--mut:#6b7280;--line:#e3e6ea;--card:#fff;--acc:#2563eb;--acc2:#dbe7ff;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#b45309;--r:12px;--sh:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05)}
:root:not([data-theme=light]) { color-scheme: light dark }
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1115;--fg:#e8eaee;--mut:#9aa3af;--line:#262a33;--card:#171a21;--acc:#7aa2ff;--acc2:#1d2a4a;--ok:#3ddc84;--okbg:#113322;--bad:#ff6b6b;--badbg:#3a1414;--warn:#f0b35a;--sh:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme=dark]{--bg:#0f1115;--fg:#e8eaee;--mut:#9aa3af;--line:#262a33;--card:#171a21;--acc:#7aa2ff;--acc2:#1d2a4a;--ok:#3ddc84;--okbg:#113322;--bad:#ff6b6b;--badbg:#3a1414;--warn:#f0b35a;--sh:0 1px 2px rgba(0,0,0,.4)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,Inter,system-ui,sans-serif}
a{color:var(--acc)}button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:9px;padding:7px 13px}button:hover{border-color:var(--mut)}
button.p{background:var(--acc);color:#fff;border-color:transparent}button.p:hover{filter:brightness(1.08)}button.p:disabled{opacity:.5;cursor:default}button.s{background:transparent}button.danger{color:var(--bad)}
button.chip{border-radius:999px;padding:4px 11px;font-size:13px}button.chip.on{background:var(--acc2);border-color:var(--acc)}
button.icon{padding:4px 9px;border-radius:8px;line-height:1;font-size:18px;background:transparent;border-color:transparent}button.icon:hover{background:var(--line)}
input,textarea,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}label{display:block;font-size:14px}label>input,label>select{margin-top:4px}
header{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;cursor:pointer}header .sp{flex:1}.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}
main{max-width:1040px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.tcard{cursor:pointer;position:relative;transition:transform .12s,border-color .12s}.tcard:hover{border-color:var(--acc);transform:translateY(-1px)}.tcard .icon{position:absolute;top:10px;right:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--sh)}.tile b{font-size:24px;display:block;line-height:1.1}.tile span{color:var(--mut);font-size:12px}.tile svg{display:block;margin-top:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 18px;overflow-x:auto}.tabs button{border:0;background:none;border-bottom:2px solid transparent;border-radius:0;padding:8px 12px;color:var(--mut)}.tabs button.on{color:var(--fg);border-bottom-color:var(--acc)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}.sb{justify-content:space-between}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--acc2);color:var(--fg);white-space:nowrap}.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.dim{background:var(--line);color:var(--mut)}
.wait{display:flex;gap:12px;align-items:center;padding:14px;border:1px dashed var(--line);border-radius:var(--r)}.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite;flex:none}@keyframes s{to{transform:rotate(360deg)}}
.q{font-size:22px;line-height:1.35;font-weight:600;margin:10px 0 16px}.choices{display:grid;gap:10px}.choices button{text-align:left;padding:14px 16px;font-size:16px;border-radius:var(--r);display:flex;gap:12px}.choices button kbd{font:600 12px system-ui;background:var(--line);padding:2px 7px;border-radius:5px;min-width:22px;text-align:center;align-self:flex-start;margin-top:3px}
.choices button.right{background:var(--okbg);border-color:var(--ok)}.choices button.wrong{background:var(--badbg);border-color:var(--bad)}.choices button:disabled{cursor:default}
.timer{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 14px}.timer i{display:block;height:100%;background:var(--acc);transition:width .25s linear}.timer.hot i{background:var(--bad)}
.why{padding:12px 14px;border-radius:var(--r);margin-top:14px}.why.ok{background:var(--okbg)}.why.bad{background:var(--badbg)}
.lvl{display:flex;gap:3px}.lvl i{width:18px;height:8px;border-radius:2px;background:var(--line)}.lvl i.on{background:var(--acc)}.lvl i.nx{background:var(--acc2);border:1px solid var(--acc)}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:600;font-size:12px}tr:last-child td{border-bottom:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.modal .card{width:min(540px,100%);max-height:92vh;overflow:auto}
.menu{position:absolute;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh);padding:4px;min-width:190px;z-index:10;display:flex;flex-direction:column}.menu button{border:0;background:none;text-align:left;border-radius:7px;padding:8px 10px}.menu button:hover{background:var(--line)}.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.mw{position:relative;display:inline-block}
ul{padding-left:20px;margin:6px 0}li{margin:3px 0}h2{font-size:18px;margin:0 0 6px}h3{font-size:15px;margin:14px 0 6px}h4{font-size:13px;margin:0 0 4px;color:var(--mut);font-weight:600}
.news b{display:block}.kbd{font:12px system-ui;color:var(--mut)}code{background:var(--line);padding:1px 5px;border-radius:5px;font-size:13px}
.chart{width:100%;height:auto;display:block;overflow:visible}.chart text{font:11px system-ui;fill:var(--mut)}.chart .grid{stroke:var(--line);stroke-width:1}.chart .ln{fill:none;stroke:var(--acc);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.chart .ar{fill:var(--acc);opacity:.1}.chart .dot{fill:var(--acc);stroke:var(--card);stroke-width:2}.chart .hit{fill:transparent}.chart .hit:hover{fill:var(--acc);opacity:.08}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;overflow-x:auto;padding-bottom:4px}.hm i{display:block;width:12px;height:12px;border-radius:3px;background:var(--line)}.hm i.l1{background:var(--acc);opacity:.3}.hm i.l2{background:var(--acc);opacity:.55}.hm i.l3{background:var(--acc);opacity:.8}.hm i.l4{background:var(--acc);opacity:1}.hm i.today{outline:1px solid var(--fg);outline-offset:1px}
.multi{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.multi>div{border:1px solid var(--line);border-radius:9px;padding:8px 10px}.multi .row{flex-wrap:nowrap}.multi .row span:first-child{min-width:0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:var(--sh);z-index:30;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:opacity .2s}#toast.on{opacity:1;pointer-events:auto}#toast button{background:none;border:0;color:var(--bg);text-decoration:underline;padding:0;font-weight:600}
.empty{padding:28px;text-align:center;color:var(--mut)}.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
body.focus #thead,body.focus .tabs,body.focus #picker,body.focus #trainhead{display:none}
body.focus #quiz{max-width:760px;margin:30px auto 0}body.focus #qc{padding:26px 28px}body.focus .q{font-size:26px;margin:16px 0 22px}body.focus .choices button{padding:16px 18px;font-size:17px}
@media(max-width:600px){.q{font-size:19px}main{padding:14px 16px 50px}body.focus .q{font-size:21px}.tcard .icon{opacity:1}}
</style></head><body>
<header><h1 onclick="location.hash='#/'">◆ SRS Edge Learning</h1><span id="crumb" class="mut sm"></span><span class="sp"></span><span id="pend" class="sm mut"></span><button class="icon" title="Settings, backup, restore" onclick="settings()">⚙</button></header>
<main id="m"></main>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s), h=s=>s==null?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=(p,b)=>fetch(p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{}).then(r=>r.json());
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
let IDX=null, T=null, tab='brief', poll=null, session=null, tick=null, toastT=null;
const LV={1:'foundations',2:'working knowledge',3:'practitioner',4:'expert',5:'edge of the field'};
const route=()=>{const p=location.hash.replace(/^#\/?/,'').split('/');return {view:p[0]||'home',slug:p[1],sub:p[2]}};
const pct=x=>x==null?'–':Math.round(x*100)+'%';
const fmtD=d=>{const x=new Date(d+'T00:00:00');return x.toLocaleDateString(undefined,{month:'short',day:'numeric'})};
window.addEventListener('hashchange',render);
function toast(msg,action,fn){clearTimeout(toastT);const t=$('#toast');t.innerHTML=`<span>${h(msg)}</span>${action?`<button id="tact">${h(action)}</button>`:''}`;if(action)$('#tact').onclick=()=>{t.classList.remove('on');fn()};t.classList.add('on');toastT=setTimeout(()=>t.classList.remove('on'),action?8000:2600)}
function modal(html){closeModal();$('#m').insertAdjacentHTML('beforeend',`<div class="modal" id="mod" onclick="if(event.target===this)closeModal()"><div class="card col">${html}</div></div>`);const f=$('#mod input,#mod select,#mod textarea');if(f)f.focus()}
function closeModal(){const m=$('#mod');if(m)m.remove();closeMenus()}
function closeMenus(){document.querySelectorAll('.menu').forEach(m=>m.remove())}
document.addEventListener('click',e=>{if(!e.target.closest('.mw'))closeMenus()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeMenus()}});
async function render(){const r=route();clearInterval(poll);session=null;document.body.classList.remove('focus');
  if(r.view==='topic'){try{await loadTopic(r.slug)}catch(e){return}tab=r.sub||tab||'brief';topicView();poll=setInterval(async()=>{if(session||$('#mod'))return;const sig=()=>JSON.stringify([T.brief&&T.brief.generated,T.categories.length,T.questions.length,T.plan&&T.plan.generated,T.agent&&T.agent.online,T.requests.filter(x=>x.status==='pending'||x.status==='claimed').length]);const before=sig();try{await loadTopic(r.slug)}catch(e){return}if(before!==sig())topicView();pendLine()},3000)}
  else{T=null;IDX=await api('/api/index');home();poll=setInterval(async()=>{if($('#mod'))return;const n=IDX.topics.length;IDX=await api('/api/index');if(IDX.topics.length!==n)home();pendLine()},4000)}
  pendLine()}
function pendLine(){const p=IDX?IDX.pending:(T?T.requests.filter(r=>r.status==='pending'||r.status==='claimed'):[]);const ag=(T&&T.agent)||(IDX&&IDX.agent)||{};const on=ag.online;const n=ag.count||0;
  $('#pend').innerHTML=`<span class="pill ${on?'ok':'dim'}" title="${on?(n>1?n+' agents are listening for requests from this page':'An agent is listening for requests from this page'):'No agent is listening. Open the Copy prompt on any waiting card.'}">${on?'● '+(n>1?n+' agents':'agent')+' listening':'○ agent offline'}</span>${p.length?` <span class="pill">${p.length} in progress</span>`:''}`}
async function loadTopic(slug){T=await api('/api/topic/'+slug);IDX=IDX||await api('/api/index');if(T.error){$('#m').innerHTML=`<div class="card">${h(T.error)} — <a href="#/">back</a></div>`;throw T.error}}

// ---------- charts (inline SVG, no libraries)
function heatmap(act,weeks){weeks=weeks||16;const today=new Date();today.setHours(0,0,0,0);const dow=(today.getDay()+6)%7;const start=new Date(today);start.setDate(today.getDate()-dow-7*(weeks-1));
  const mx=Math.max(1,...Object.values(act).map(v=>v[1]));const cells=[];for(let i=0;i<weeks*7;i++){const d=new Date(start);d.setDate(start.getDate()+i);if(d>today)break;const k=d.toISOString().slice(0,10);const v=act[k];const lvl=!v?0:Math.min(4,Math.ceil(v[1]/mx*4));cells.push(`<i class="l${lvl}${k===today.toISOString().slice(0,10)?' today':''}" title="${fmtD(k)}: ${v?v[0]+'/'+v[1]+' right':'no questions'}"></i>`)}
  return `<div class="hm">${cells.join('')}</div>`}
const chartW=()=>{const el=$('#tab')||$('#m');return Math.max(320,(el?el.clientWidth:900)-34)};
function lineChart(pts,o){o=o||{};const W=o.w||chartW(),H=o.h||140,L=34,R=12,Tp=10,B=22,n=pts.length;if(!n)return `<div class="empty sm">${h(o.empty||'no data yet')}</div>`;
  const ymin=o.ymin!=null?o.ymin:0,ymax=o.ymax!=null?o.ymax:Math.max(1,...pts.map(p=>p.y));const X=i=>L+(n===1?(W-L-R)/2:i/(n-1)*(W-L-R)),Y=v=>Tp+(1-(v-ymin)/(ymax-ymin||1))*(H-Tp-B);
  const ticks=o.ticks||[ymin,(ymin+ymax)/2,ymax];const fy=o.fmt||(v=>v);const path=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const area=`M${X(0).toFixed(1)} ${Y(ymin)} `+pts.map((p,i)=>'L'+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ')+` L${X(n-1).toFixed(1)} ${Y(ymin)} Z`;
  const step=Math.max(1,Math.ceil(n/6));const xl=pts.map((p,i)=>(i%step===0||i===n-1)&&(n-1-i>=step/2||i===n-1)?`<text x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="${i===n-1?'end':i===0?'start':'middle'}">${h(p.label||'')}</text>`:'').join('');
  const hits=pts.map((p,i)=>{const w=n>1?(W-L-R)/(n-1):W-L-R;return `<rect class="hit" x="${(X(i)-w/2).toFixed(1)}" y="${Tp}" width="${w.toFixed(1)}" height="${H-Tp-B}"><title>${h(p.label||'')}: ${h(p.tip!=null?p.tip:fy(p.y))}</title></rect>`}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="aspect-ratio:${W}/${H}">${ticks.map(t=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/><text x="${L-6}" y="${(Y(t)+4).toFixed(1)}" text-anchor="end">${h(fy(t))}</text>`).join('')}${o.area!==false?`<path class="ar" d="${area}"/>`:''}<path class="ln" d="${path}"/><circle class="dot" cx="${X(n-1).toFixed(1)}" cy="${Y(pts[n-1].y).toFixed(1)}" r="4"/>${xl}${hits}</svg>`}
function spark(vals,o){o=o||{};const W=o.w||120,H=o.h||28,n=vals.length;if(n<2)return '';const mx=o.max!=null?o.max:Math.max(1,...vals),mn=o.min||0;const X=i=>2+i/(n-1)*(W-4),Y=v=>2+(1-(v-mn)/(mx-mn||1))*(H-4);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="aspect-ratio:${W}/${H};max-width:${W}px"><path class="ln" d="${vals.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ')}"/><circle class="dot" cx="${X(n-1).toFixed(1)}" cy="${Y(vals[n-1]).toFixed(1)}" r="3.5"/></svg>`}
// replay the server's edge rule over time (first quiz attempt per question, per category)
function edgeSeries(){const q={};T.questions.forEach(x=>{if(!x.retired)q[x.id]=x});const days=[...new Set(T.attempts.map(a=>a.ts.slice(0,10)))].sort();const per={};T.categories.forEach(c=>per[c.id]=[]);const seen=new Set(),acc={};let i=0;const out=[];
  for(const d of days){while(i<T.attempts.length&&T.attempts[i].ts.slice(0,10)<=d){const a=T.attempts[i++];if(a.mode!=='quiz'||seen.has(a.qid)||!q[a.qid])continue;seen.add(a.qid);const x=q[a.qid];const m=acc[x.cat]=acc[x.cat]||{};const L=+x.level||2;m[L]=m[L]||[0,0];m[L][1]++;if(a.correct)m[L][0]++}
    let tot=0;for(const c of T.categories){const by=acc[c.id]||{};let e=0;for(let L=1;L<=5;L++){const [r,n]=by[L]||[0,0];if(n>=3&&r/n>=.6)e=L;else if(n>=3)break}per[c.id].push(e);tot+=e}
    out.push({label:fmtD(d),y:T.categories.length?+(tot/T.categories.length).toFixed(2):0,day:d})}
  return {overall:out,per}}
function rollingAcc(){const days=[...new Set(T.attempts.map(a=>a.ts.slice(0,10)))].sort();return days.map(d=>{const lo=new Date(d+'T00:00:00');lo.setDate(lo.getDate()-6);const lok=lo.toISOString().slice(0,10);const w=T.attempts.filter(a=>a.ts.slice(0,10)>=lok&&a.ts.slice(0,10)<=d);const r=w.filter(a=>a.correct).length;return {label:fmtD(d),y:w.length?r/w.length:0,tip:`${r}/${w.length} right over 7 days`}})}

// ---------- home
function home(){$('#crumb').textContent='';const all=IDX.topics;const live=all.filter(t=>!t.archived).sort((a,b)=>(b.due-a.due)||String(b.last_active).localeCompare(String(a.last_active)));const arch=all.filter(t=>t.archived);
  const act={};all.forEach(t=>Object.entries(t.activity||{}).forEach(([d,v])=>{act[d]=act[d]||[0,0];act[d][0]+=v[0];act[d][1]+=v[1]}));const totalDue=live.reduce((a,t)=>a+t.due,0);
  $('#m').innerHTML=`<div class="row sb" style="margin-bottom:14px"><div><h2>Your topics</h2><div class="mut sm">Pick one to continue, or start something new. Your agent writes the content; this page measures you and schedules the reviews.</div></div><button class="p" onclick="newTopic()">+ New topic</button></div>
  <div class="tiles" style="margin-bottom:12px"><div class="tile"><b>${live.length}</b><span>topics${arch.length?` · ${arch.length} archived`:''}</span></div><div class="tile"><b>${all.reduce((a,t)=>a+t.answered,0)}</b><span>questions met</span></div><div class="tile"><b>${totalDue}</b><span>cards due today</span></div><div class="tile"><b>${Math.max(0,...all.map(t=>t.streak_days))}</b><span>day streak</span></div></div>
  <div class="card" style="margin-bottom:16px"><div class="row sb"><h4 style="margin:0">Activity, last 16 weeks</h4><span class="xs mut">darker = more questions that day</span></div>${heatmap(act)}</div>
  <div class="grid">${live.map(card).join('')||`<div class="card empty" style="grid-column:1/-1"><b>No topics yet</b>Click <b>New topic</b>, name the thing you want to get smart at, and your agent takes it from there.</div>`}</div>
  ${arch.length?`<details style="margin-top:18px"><summary class="mut sm" style="cursor:pointer">${arch.length} archived topic${arch.length>1?'s':''}</summary><div class="grid" style="margin-top:10px">${arch.map(card).join('')}</div></details>`:''}
  <p class="mut xs" style="margin-top:22px">Data lives in <code>${h(IDX.home)}</code> · hub on port ${h(IDX.port)} · v${h(IDX.version)} · nothing leaves this machine. <a href="#" onclick="settings();return false">Backup &amp; restore</a> is under ⚙.</p>`}
function card(t){return `<div class="card col tcard" onclick="location.hash='#/topic/${t.slug}'"><button class="icon" title="Rename, archive, export, delete" onclick="event.stopPropagation();topicMenu(this,'${t.slug}')">⋯</button><div class="row" style="padding-right:30px"><b>${h(t.name)}</b>${t.due?`<span class="pill">${t.due} due</span>`:''}${t.archived?'<span class="pill dim">archived</span>':''}</div><div class="mut sm">${h(t.goal)||'&nbsp;'}</div>
   <div class="row sm"><span>edge L${t.overall_edge}</span><span class="mut">·</span><span>${t.answered}/${t.questions} answered</span><span class="mut">·</span><span>${pct(t.accuracy)}</span>${t.streak_days?`<span class="mut">·</span><span>${t.streak_days}d streak</span>`:''}</div>
   <div class="bar"><i style="width:${t.overall_edge/5*100}%"></i></div><div class="mut xs">${t.has_brief?'brief ✓':'no brief yet'} · ${t.categories} categories · ${t.plan?'protocol ✓':'no protocol'}</div></div>`}
function newTopic(){modal(`<h2>New topic</h2><label>What do you want to get smart at?<input id="nt" placeholder="e.g. Rust ownership, MiFID II, how LLM inference works"></label>

async function saveRename(slug){const r=await api('/api/topic/update',{slug,name:$('#rn').value,goal:$('#rg').value,level:$('#rl').value});closeModal();if(r.error)return toast(r.error);toast('Saved');render()}

  <div class="tabs">${['brief','learn','train','progress','plan'].map(t=>`<button class="${tab===t?'on':''}" onclick="tab='${t}';location.hash='#/topic/${T.slug}/${t}'">${{brief:'Brief',learn:'Go deeper',train:`Train${s.due?' ('+s.due+')':''}`,progress:'Progress',plan:'Protocol'}[t]}</button>`).join('')}</div><div id="tab"></div>`;
  ({brief,learn,train,progress,plan})[tab]()}
const pendingOf=k=>T.requests.find(r=>(r.status==='pending'||r.status==='claimed')&&r.type===k);

function copy(txt,btn){const done=()=>{const o=btn.textContent;btn.textContent='Copied ✓';setTimeout(()=>btn.textContent=o,1500)};try{navigator.clipboard.writeText(txt).then(done,()=>{const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();done()})}catch(e){prompt('Copy this:',txt)}}
const waiting=(k,what)=>{const r=pendingOf(k);const on=T.agent&&T.agent.online;const cancel=r?` · <a href="#" onclick="cancelReq('${r.id}');return false">cancel</a>`:'';
  if(on)return `<div class="wait"><div class="spin"></div><div class="col" style="gap:6px"><div><b>Your agent is writing ${what}.</b></div><div class="sm">Nothing to do. Stay on this page or come back in a minute; it updates by itself.</div><div class="sm mut">Usually under a minute for a map or questions, a couple of minutes for a brief with fresh news.${r?` · request ${h(r.id.slice(-4))}${r.status==='claimed'?' (picked up)':''}`:''}${cancel}</div></div></div>`;
  return `<div class="wait" style="align-items:flex-start"><div style="font-size:22px;line-height:1">○</div><div class="col" style="flex:1;gap:8px">
  <div><b>No agent is listening right now.</b> ${what[0].toUpperCase()+what.slice(1)} is queued and will be written as soon as one connects.</div>
  <div class="sm">Open your AI agent (Claude Code, Codex, Copilot CLI) in a terminal and paste:</div>
  <div class="row" style="gap:8px"><code style="font-size:14px;padding:8px 12px;flex:1;min-width:200px">${h(PROMPT)}</code><button class="p" onclick="copy(PROMPT,this)">Copy</button></div>
  <div class="sm mut">The header turns to <b>● agent listening</b> when it's connected, and this card fills in by itself.${cancel}</div></div></div>`};
async function req(type,params,note){await api('/api/request',{topic:T.slug,type,params:params||{},note:note||''});await loadTopic(T.slug);topicView()}
async function cancelReq(id){await api('/api/request/cancel',{id});toast('Request cancelled');await loadTopic(T.slug);topicView()}

function brief(){const b=T.brief;
  if(!b){$('#tab').innerHTML=pendingOf('brief')?waiting('brief','the brief'):`<div class="card col"><b>No brief yet.</b><div class="mut">A curated read: what it is, how it applies to business and life, who the movers are, what's recent.</div><div class="row"><button class="p" onclick="req('brief',{mode:'cliff'})">Cliff notes</button><button onclick="req('brief',{mode:'bullets'})">Short bullets</button></div></div>`;return}
  $('#tab').innerHTML=`<div class="card"><div class="row sm mut sb"><span>${b.mode==='cliff'?'Cliff notes':'Short bullets'} · knowledge as of ${h(b.as_of)}${b.sources_live?' · web-checked':' · model knowledge'}</span><span>${pendingOf('brief')?'<span class="sm mut">rewriting…</span>':`<button class="chip" onclick="req('brief',{mode:'${b.mode==='cliff'?'bullets':'cliff'}'})">Rewrite as ${b.mode==='cliff'?'bullets':'cliff notes'}</button> <button class="chip" onclick="req('brief',{mode:'${b.mode}',refresh:true})">Refresh news</button>`}</span></div>
   <p style="font-size:17px">${h(b.summary)}</p>
   ${(b.sections||[]).map(s=>`<h3>${h(s.title)}</h3>${s.text?`<p>${h(s.text)}</p>`:''}${s.bullets?`<ul>${s.bullets.map(x=>`<li>${h(x)}</li>`).join('')}</ul>`:''}`).join('')}
   ${b.movers&&b.movers.length?`<h3>Movers</h3><table><tr><th>Who</th><th>Why they matter</th></tr>${b.movers.map(m=>`<tr><td><b>${h(m.name)}</b>${m.role?`<div class="mut sm">${h(m.role)}</div>`:''}</td><td>${h(m.why)}</td></tr>`).join('')}</table>`:''}
   ${b.news&&b.news.length?`<h3>Recent &amp; relevant</h3><div class="col news">${b.news.map(n=>`<div><b>${h(n.title)} <span class="mut sm">${h(n.date||'')}</span></b><span class="sm">${h(n.why)}</span>${n.url?` <a class="sm" href="${h(n.url)}" target="_blank" rel="noopener">↗</a>`:''}</div>`).join('')}</div>`:''}
   ${b.glossary&&b.glossary.length?`<h3>Words to know</h3><table>${b.glossary.map(g=>`<tr><td><b>${h(g.term)}</b></td><td>${h(g.means)}</td></tr>`).join('')}</table>`:''}
   ${b.sources&&b.sources.length?`<h3>Sources</h3><ul class="sm">${b.sources.map(s=>`<li>${/^https?:/.test(s)?`<a href="${h(s)}" target="_blank" rel="noopener">${h(s)}</a>`:h(s)}</li>`).join('')}</ul>`:''}
   <div class="row" style="margin-top:18px"><button class="p" onclick="tab='learn';location.hash='#/topic/${T.slug}/learn'">Go deeper → find my edge</button></div></div>`}

// ---------- learn (adaptive quiz)
function learn(){const s=T.summary;
  if(!T.categories.length){$('#tab').innerHTML=pendingOf('categories')?waiting('categories','the map of this topic (categories)'):`<div class="card col"><b>First, a map.</b><div class="mut">Your agent splits the topic into 4–12 categories. Then timed questions find the edge of what you know in each one, and get harder as you go.</div><div><button class="p" onclick="req('categories')">Build the map</button></div></div>`;return}
  const sel=JSON.parse(ls('sel:'+T.slug)||'null')||T.categories.map(c=>c.id);
  $('#tab').innerHTML=`<div class="card col" id="picker"><div class="row sb"><b>Pick categories</b><span class="sm mut">${IDX.settings.read_seconds}s to read · ${IDX.settings.answer_seconds}s to answer · blocks of ${IDX.settings.block} · <a href="#" onclick="settings();return false">change</a></span></div>
   <div class="row" id="cats">${T.categories.map(c=>{const e=s.edge[c.id]||{};return `<button class="chip ${sel.includes(c.id)?'on':''}" data-id="${c.id}" title="${h(c.why)}" onclick="this.classList.toggle('on');saveSel()">${h(c.name)} <span class="mut">L${e.edge||0}→${e.next||'?'}</span></button>`}).join('')}</div>
   <div class="sm mut">${(n=>n?`Answer <b>${n}</b> more question${n>1?'s':''} across the selected categories to get your first edge reading (3 per level per category).`:'Edge readings are current; the next round moves them.')(T.categories.filter(c=>sel.includes(c.id)).reduce((a,c)=>a+((s.edge[c.id]||{}).need||0),0))}</div>
   <div class="row"><button class="p" onclick="startQuiz('quiz')">Start a round</button><button onclick="req('questions',{cats:selCats(),levels:nextLevels(selCats()),n:12},'more questions please')" ${pendingOf('questions')?'disabled':''}>Ask agent for more questions</button>${pendingOf('questions')?'<span class="sm mut">questions requested, agent is writing…</span>':''}</div>
   <div class="xs mut">Bank: ${T.categories.map(c=>`${h(c.name)} ${Object.entries(s.unanswered[c.id]||{}).map(([l,n])=>`L${l}×${n}`).join(' ')||'—'}`).join(' · ')}${s.retired?` · ${s.retired} retired`:''}</div></div><div id="quiz"></div>`}
const selCats=()=>[...document.querySelectorAll('#cats .chip.on')].map(b=>b.dataset.id);
const saveSel=()=>ls('sel:'+T.slug,JSON.stringify(selCats()));
const nextLevels=cats=>[...new Set(cats.flatMap(c=>{const n=(T.summary.edge[c]||{}).next||2;return [n,Math.min(5,n+1)]}))].sort();
function pickNext(cats,mode){const seen=new Set(T.attempts.map(a=>a.qid));const liveQ=T.questions.filter(q=>!q.retired);
  if(mode==='train'){const due=new Set(T.due);return liveQ.filter(q=>due.has(q.id)&&!session.done.has(q.id))[0]}
  for(let k=0;k<cats.length;k++){const c=cats[(session.i+k)%cats.length];const want=(T.summary.edge[c]||{}).next||2;
    const pool=liveQ.filter(q=>q.cat===c&&!seen.has(q.id)&&!session.done.has(q.id));
    const q=pool.find(q=>q.level===want)||pool.find(q=>Math.abs(q.level-want)===1)||pool[0];if(q){session.i=(session.i+k+1)%cats.length;return q}}
  return null}
function ensureBank(cats){const low=cats.filter(c=>{const want=(T.summary.edge[c]||{}).next||2;const u=T.summary.unanswered[c]||{};return ((u[want]||0)+(u[want+1]||0))<4});
  if(low.length&&!pendingOf('questions')&&IDX.settings.auto_requests)api('/api/request',{topic:T.slug,type:'questions',params:{cats:low,levels:nextLevels(low),n:10},note:'auto: bank running low'})}
function startQuiz(mode){const cats=mode==='train'?T.categories.map(c=>c.id):selCats();if(!cats.length)return toast('Pick at least one category');
  session={mode,cats,i:0,done:new Set(),n:0,right:0,start:Date.now(),target:mode==='train'?T.due.length:IDX.settings.block*cats.length};
  document.body.classList.add('focus');if(mode==='quiz')ensureBank(cats);nextQ()}
async function nextQ(){clearInterval(tick);if(!session)return;const q=pickNext(session.cats,session.mode);
  if(!q||session.n>=session.target){return endQuiz(q?'target':'empty')}
  session.q=q;session.phase='read';const rs=Math.max(IDX.settings.read_seconds,Math.round(q.q.length/30)),as=IDX.settings.answer_seconds;const cat=T.categories.find(c=>c.id===q.cat)||{name:q.cat};
  const box=$('#quiz')||$('#tab');box.innerHTML=`<div class="card" id="qc"><div class="row sm mut sb"><span><b style="color:var(--fg)">${h(T.name)}</b> · ${h(cat.name)} · L${q.level} ${LV[q.level]} · ${session.n+1}/${session.target}</span><span>${session.right}/${session.n} right · <a href="#" onclick="endQuiz('stop');return false">stop</a></span></div>
   <div class="timer" id="tm"><i style="width:100%"></i></div><div class="q">${h(q.q)}</div><div id="ch" class="mut sm">Read it. Choices in <b id="cd">${rs}</b>s… <span class="kbd">(space to show now)</span></div></div>`;
  let left=rs;const t0=Date.now();tick=setInterval(()=>{left=rs-(Date.now()-t0)/1000;$('#cd')&&($('#cd').textContent=Math.ceil(left));$('#tm i').style.width=Math.max(0,left/rs*100)+'%';if(left<=0)showChoices(as)},250)}
function showChoices(as){clearInterval(tick);if(!session||session.phase!=='read')return;session.phase='answer';const q=session.q;session.t0=Date.now();
  $('#ch').className='choices';$('#ch').innerHTML=q.choices.map((c,i)=>`<button onclick="answer(${i})"><kbd>${i+1}</kbd><span>${h(c)}</span></button>`).join('');$('#tm').classList.remove('hot');$('#tm i').style.width='100%';
  tick=setInterval(()=>{const left=as-(Date.now()-session.t0)/1000;$('#tm i').style.width=Math.max(0,left/as*100)+'%';if(left<5)$('#tm').classList.add('hot');if(left<=0)answer(null)},200)}
async function answer(i){if(!session||session.phase!=='answer')return;clearInterval(tick);session.phase='result';const q=session.q,ms=Date.now()-session.t0;
  const r=await api('/api/attempt',{topic:T.slug,qid:q.id,picked:i,ms,mode:session.mode});if(r.error){toast(r.error);return nextQ()}session.n++;session.done.add(q.id);if(r.correct)session.right++;
  [...document.querySelectorAll('#ch button')].forEach((b,k)=>{b.disabled=true;if(k===r.answer)b.classList.add('right');else if(k===i)b.classList.add('wrong')});
  $('#qc').insertAdjacentHTML('beforeend',`<div class="why ${r.correct?'ok':'bad'}"><b>${r.correct?'Right':i==null?'Time':'Not quite'}</b> ${r.correct?'':'— '+h(q.choices[r.answer])}<div class="sm">${h(r.why)}</div><div class="row sb sm mut" style="margin-top:6px"><span>next review in ${r.srs.interval}d · <span class="kbd">space / enter for next</span></span><a href="#" class="xs" onclick="flagQ('${q.id}');return false">⚑ flag this question</a></div></div>`);
  session.auto=setTimeout(nextQ,r.correct?2200:5000)}
function flagQ(qid){if(session)clearTimeout(session.auto);const q=T.questions.find(x=>x.id===qid);modal(`<h2>Flag this question</h2><div class="sm mut">${h(q.q)}</div><label>What's wrong with it?<select id="fr"><option>The marked answer is wrong</option><option>Two choices are right / it's ambiguous</option><option>Typo or unclear wording</option><option>Too easy to be useful</option><option>Not about this topic</option><option value="other">Something else…</option></select></label><input id="fo" placeholder="say what (optional)" style="margin-top:6px">
  <label class="row" style="gap:8px"><input id="fx" type="checkbox" style="width:auto" checked> Ask the agent for a replacement at this level</label><div class="xs mut">A flagged question leaves the bank, your edge maths and the review deck. It is kept on file so the agent knows not to write it again, and you can restore it from Progress.</div>
  <div class="row" style="justify-content:flex-end"><button onclick="closeModal();if(session)session.auto=setTimeout(nextQ,1500)">Cancel</button><button class="p" onclick="doFlag('${qid}')">Flag &amp; retire</button></div>`)}
async function doFlag(qid){const sel=$('#fr');let reason=sel.value==='other'?'':sel.value;const o=$('#fo').value.trim();if(o)reason=reason?reason+': '+o:o;const r=await api('/api/question/retire',{topic:T.slug,qid,reason,replace:$('#fx').checked});closeModal();
  if(r.error)return toast(r.error);toast('Retired. '+($('#fx')&&$('#fx').checked?'Replacement requested.':''));if(session){session.done.add(qid);session.auto=setTimeout(nextQ,400)}else{await loadTopic(T.slug);topicView()}}
async function endQuiz(reason){document.body.classList.remove('focus');clearInterval(tick);clearTimeout(session&&session.auto);const s=session;session=null;await loadTopic(T.slug);
  const msg=reason==='empty'?(pendingOf('questions')?'The bank ran dry; your agent is writing more. Come back in a minute.':'The bank ran dry. Ask your agent for more questions.'):'Round done.';
  if(s.mode==='quiz'&&reason==='empty'&&!pendingOf('questions')&&IDX.settings.auto_requests)await api('/api/request',{topic:T.slug,type:'questions',params:{cats:s.cats,levels:nextLevels(s.cats),n:12},note:'auto: bank empty after round'});
  topicView();const b=$('#quiz')||$('#tab');if(!b)return;
  if(s.n===0&&reason!=='empty')return;
  if(s.n===0){b.insertAdjacentHTML('afterbegin',`<div class="card" style="margin-bottom:12px"><b>No questions in the bank yet.</b> <span class="sm">${pendingOf('questions')?'Your agent is writing them; this page updates by itself and then <b>Start a round</b> will work.':'Press <b>Ask agent for more questions</b>.'}</span></div>`);return}
  b.insertAdjacentHTML('afterbegin',`<div class="card" style="margin-bottom:12px"><b>${msg}</b> ${s.right}/${s.n} right in ${Math.round((Date.now()-s.start)/1000)}s.${s.mode==='quiz'?(n=>n?` <b>${n}</b> more to the next edge reading — <a href="#/topic/${T.slug}/progress">Progress</a>.`:' Edge updated — see <a href="#/topic/'+T.slug+'/progress">Progress</a>.')(Object.values(T.summary.edge).reduce((a,x)=>a+x.need,0)):''}</div>`)}
document.addEventListener('keydown',e=>{if(!session||e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||$('#mod'))return;if(session.phase==='read'&&e.code==='Space'){e.preventDefault();showChoices(IDX.settings.answer_seconds)}
  else if(session.phase==='answer'&&/^[1-4]$/.test(e.key))answer(+e.key-1);else if(session.phase==='result'&&(e.code==='Space'||e.key==='Enter')){e.preventDefault();clearTimeout(session.auto);nextQ()}else if(session.phase==='result'&&e.key==='f'){flagQ(session.q.id)}});

// ---------- train (SRS)
function train(){const n=T.due.length;const sched=Object.entries(T.questions.filter(q=>!q.retired&&T.srs[q.id]).reduce((a,q)=>{const d=T.srs[q.id].due;a[d]=(a[d]||0)+1;return a},{})).sort();const mx=Math.max(1,...sched.map(x=>x[1]));
  const tr=T.attempts.filter(a=>a.mode==='train');const ret=tr.length?tr.filter(a=>a.correct).length/tr.length:null;
  $('#tab').innerHTML=`<div class="card col" id="trainhead"><div class="row sb"><b>${n?n+' card'+(n>1?'s':'')+' due':'Nothing due'}</b><span class="sm mut">retention ${pct(ret)}${tr.length?` over ${tr.length} reviews`:''}</span></div><div class="mut">Spaced repetition: questions you've met come back just before you'd forget them. Right → longer gap. Wrong → tomorrow.</div>
   ${n?`<div><button class="p" onclick="startQuiz('train')">Review now</button></div>`:`<div class="sm mut">${T.questions.length?'Answer questions in <b>Go deeper</b> to seed the deck.':'No questions yet.'}</div>`}
   <h4 style="margin-top:8px">Coming up</h4><table>${sched.slice(0,10).map(([d,c])=>`<tr><td style="width:110px">${d<=new Date().toISOString().slice(0,10)?'<b>due</b>':fmtD(d)}</td><td><div class="row" style="gap:8px"><div class="bar" style="width:${Math.round(c/mx*100)}%;max-width:260px;min-width:8px"><i style="width:100%"></i></div><span class="sm">${c}</span></div></td></tr>`).join('')||'<tr><td colspan=2 class="mut">—</td></tr>'}</table></div><div id="quiz"></div>`}

// ---------- progress
function progress(){const s=T.summary,e=s.edge;const es=edgeSeries();const ra=rollingAcc();const tr=T.attempts.filter(a=>a.mode==='train');const ret=tr.length?tr.filter(a=>a.correct).length/tr.length:null;
  const retDays=[...new Set(tr.map(a=>a.ts.slice(0,10)))].sort().slice(-14).map(d=>{const w=tr.filter(a=>a.ts.slice(0,10)===d);return w.filter(a=>a.correct).length/w.length});
  const flaggedQ=T.questions.filter(q=>q.retired);
  $('#tab').innerHTML=`<div class="tiles" style="margin-bottom:12px"><div class="tile"><b>L${s.overall_edge}</b><span>overall edge</span>${spark(es.overall.map(p=>p.y),{max:5})}</div><div class="tile"><b>${s.answered}</b><span>questions met</span></div><div class="tile"><b>${pct(s.accuracy)}</b><span>accuracy, all time</span>${spark(ra.map(p=>p.y),{max:1})}</div><div class="tile"><b>${pct(ret)}</b><span>retention on reviews</span>${spark(retDays,{max:1})}</div><div class="tile"><b>${s.due}</b><span>due today</span></div><div class="tile"><b>${Object.values(e).reduce((a,x)=>a+x.need,0)}</b><span>more to next reading</span></div></div>
  <div class="card" style="margin-bottom:12px"><div class="row sb"><h4 style="margin:0">Edge over time</h4><span class="xs mut">average held level across categories, by active day</span></div>${lineChart(es.overall,{h:150,ymax:5,ticks:[0,1,2,3,4,5],fmt:v=>'L'+v,empty:'Play a round and the edge line starts here.'})}
   ${T.categories.length?`<div class="multi" style="margin-top:12px">${T.categories.map(c=>{const v=es.per[c.id]||[];const x=e[c.id];return `<div><div class="row sb"><span class="sm" style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h(c.name)}</span><span class="xs mut">L${x.edge}→${x.next}</span></div>${v.length>1?spark(v,{max:5,w:140,h:26}):`<div class="xs mut">${v.length?'one reading':'no reading yet'}</div>`}</div>`}).join('')}</div>`:''}</div>
  <div class="card" style="margin-bottom:12px"><div class="row sb"><h4 style="margin:0">Accuracy, 7-day rolling</h4><span class="xs mut">share of answers right in the week ending each active day</span></div>${lineChart(ra,{h:130,ymax:1,ticks:[0,.5,1],fmt:v=>Math.round(v*100)+'%',empty:'No answers yet.'})}
   <div class="row sb" style="margin-top:12px"><h4 style="margin:0">Activity, last 16 weeks</h4><span class="xs mut">${Object.keys(s.activity||{}).length} active day${Object.keys(s.activity||{}).length===1?'':'s'} · streak ${s.streak_days}</span></div>${heatmap(s.activity||{})}</div>
  <div class="card"><h3 style="margin-top:0">Edge by category</h3><div class="sm mut" style="margin-bottom:8px">A level counts as <b>held</b> once you've answered 3 questions at it with at least 2 right. Your edge is the highest held level. After 3 at a level: 80%+ moves you up, 40% or less moves you down.</div><table><tr><th>Category</th><th>Edge</th><th>Next</th><th>By level (right/asked)</th><th>Acc</th></tr>${T.categories.map(c=>{const x=e[c.id];return `<tr><td><b>${h(c.name)}</b><div class="mut sm">${h(c.why)}</div></td><td><div class="lvl">${[1,2,3,4,5].map(l=>`<i class="${l<=x.edge?'on':l===x.next?'nx':''}"></i>`).join('')}</div><span class="sm">${x.edge?`L${x.edge} ${LV[x.edge]}`:'not yet measured'}</span></td><td>L${x.next}<div class="sm mut">${x.need?x.need+' more to read':'reading ready'}</div></td><td class="sm">${Object.entries(x.by_level).map(([l,v])=>`L${l} ${v.right}/${v.n}`).join(' · ')||'—'}</td><td>${pct(x.accuracy)}</td></tr>`}).join('')}</table>
   <div class="row" style="margin-top:16px"><button class="p" onclick="req('diagnose',{},'why do I keep missing these?')" ${pendingOf('diagnose')?'disabled':''}>Diagnose my misses → training protocol</button>${pendingOf('diagnose')?'<span class="sm mut">agent is diagnosing…</span>':''}</div></div>
  ${flaggedQ.length?`<div class="card" style="margin-top:12px"><h4>Flagged questions (${flaggedQ.length})</h4><div class="xs mut" style="margin-bottom:6px">Out of the bank and the deck. Restore one if you flagged it by mistake.</div><table>${flaggedQ.map(q=>`<tr><td><span class="sm">${h(q.q)}</span><div class="xs mut">${h(q.retired.reason)} · ${h((q.retired.ts||'').slice(0,10))}</div></td><td style="width:90px;text-align:right"><button class="chip" onclick="unflag('${q.id}')">Restore</button></td></tr>`).join('')}</table></div>`:''}`}
async function unflag(qid){await api('/api/question/retire',{topic:T.slug,qid,restore:true});toast('Restored');await loadTopic(T.slug);topicView()}

// ---------- plan
function plan(){const p=T.plan;if(!p){$('#tab').innerHTML=pendingOf('diagnose')?waiting('diagnose','your diagnosis and training protocol'):`<div class="card empty"><b>No protocol yet</b>Answer a few rounds, then press <b>Diagnose my misses</b> on the Progress tab. The agent reads what you got wrong, finds the root cause, and writes a training protocol.</div>`;return}
  const done=JSON.parse(ls('plan:'+T.slug)||'{}');
  $('#tab').innerHTML=`<div class="card"><div class="mut sm">written ${h(p.generated)}</div><h3 style="margin-top:6px">Diagnosis</h3><p>${h(p.diagnosis)}</p><h3>Root causes</h3><ul>${(p.root_causes||[]).map(x=>`<li>${h(x)}</li>`).join('')}</ul>
   <h3>Training protocol</h3><div class="col">${p.protocol.map((s,i)=>`<label class="row" style="align-items:flex-start;gap:10px"><input type="checkbox" style="width:auto;margin-top:5px" ${done[i]?'checked':''} onchange="(d=>{d[${i}]=this.checked;ls('plan:'+T.slug,JSON.stringify(d))})(JSON.parse(ls('plan:'+T.slug)||'{}'))"><span><b>${h(s.step)}</b>${s.how?`<div class="sm">${h(s.how)}</div>`:''}${s.when?`<div class="sm mut">${h(s.when)}</div>`:''}</span></label>`).join('')}</div>
   ${p.next_test?`<h3>Re-test when</h3><p>${h(p.next_test)}</p>`:''}<div class="row" style="margin-top:12px"><button onclick="tab='learn';location.hash='#/topic/${T.slug}/learn'">Re-test now</button><button onclick="req('diagnose',{},'refresh protocol')" ${pendingOf('diagnose')?'disabled':''}>Refresh protocol</button></div></div>`}

// ---------- settings, backup, restore
function settings(){const s=IDX?IDX.settings:{read_seconds:8,answer_seconds:20,block:5};modal(`<h2>Settings</h2>
  <div class="row" style="gap:12px"><label style="flex:1">Seconds to read<input id="s1" type="number" min="2" max="60" value="${s.read_seconds}"></label><label style="flex:1">Seconds to answer<input id="s2" type="number" min="5" max="300" value="${s.answer_seconds}"></label><label style="flex:1">Per category per round<input id="s3" type="number" min="1" max="20" value="${s.block}"></label></div>
  <label class="row" style="gap:8px"><input id="s5" type="checkbox" style="width:auto" ${s.auto_requests?'checked':''}> Ask the agent for more questions automatically when the bank runs low</label>
  <label>Theme<select id="s4" onchange="document.documentElement.dataset.theme=this.value;ls('theme',this.value)"><option value="">System</option><option value="light" ${ls('theme')==='light'?'selected':''}>Light</option><option value="dark" ${ls('theme')==='dark'?'selected':''}>Dark</option></select></label>
  <h3>Backup &amp; restore</h3><div class="sm mut">A backup is a zip of every topic (brief, questions, answers, reviews, protocol) plus your settings. Restore it on another machine, or import a single topic file someone exported.</div>
  <div class="row"><a class="p" href="/api/backup" download style="text-decoration:none;color:#fff;background:var(--acc);padding:7px 13px;border-radius:9px">Download backup</a><label style="flex:1;min-width:200px"><input type="file" id="rf" accept=".zip,.json" style="padding:5px"></label></div>
  <div class="row sb"><label class="row sm" style="gap:8px"><input id="ro" type="checkbox" style="width:auto"> Replace topics that already exist</label><button onclick="restoreFile()">Restore from file</button></div>
  <div class="xs mut">Data folder <code>${h(IDX?IDX.home:'')}</code> · port ${h(IDX?IDX.port:'')} · v${h(IDX?IDX.version:'')}</div>
  <div class="row" style="justify-content:flex-end"><button onclick="closeModal()">Cancel</button><button class="p" onclick="saveSettings()">Save</button></div>`)}
async function saveSettings(){IDX.settings=await api('/api/settings',{read_seconds:$('#s1').value,answer_seconds:$('#s2').value,block:$('#s3').value,auto_requests:$('#s5').checked?1:0});closeModal();toast('Settings saved');render()}
async function restoreFile(){const f=$('#rf').files[0];if(!f)return toast('Choose a .zip backup or a topic .json first');const r=await fetch('/api/restore?overwrite='+($('#ro').checked?1:0),{method:'POST',body:f}).then(r=>r.json());if(r.error)return toast(r.error);closeModal();
  toast(`Restored: ${r.added.length} added, ${r.replaced.length} replaced${r.skipped.length?`, ${r.skipped.length} skipped (already here; tick "Replace" to overwrite)`:''}`);location.hash='#/';render()}
try{const th=ls('theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
render();
</script></body></html>
