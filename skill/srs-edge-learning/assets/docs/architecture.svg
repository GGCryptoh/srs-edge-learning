<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 370" font-family="-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker>
    <style>
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
      .hot{fill:#eef4ff;stroke:#2563eb}.warm{fill:#fff7ed;stroke:#f59e0b}
      .t{font-size:17px;font-weight:700;fill:#111827}.s{font-size:13px;fill:#4b5563}.n{font-size:12px;font-weight:700;fill:#2563eb}
      .l{stroke:#6b7280;stroke-width:1.6;fill:none;marker-end:url(#a)}.lab{font-size:12px;fill:#374151}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#374151}
      @media (prefers-color-scheme: dark){.box{fill:#171a21;stroke:#334155}.hot{fill:#1d2a4a;stroke:#7aa2ff}.warm{fill:#3a2a10;stroke:#f0b35a}.t{fill:#e8eaee}.s,.lab,.mono{fill:#9aa3af}.n{fill:#7aa2ff}}
    </style>
  </defs>
  <text class="s" x="20" y="36" font-size="14">Architecture — three parts on your machine, nothing in the cloud</text>
  <!-- browser -->
  <rect class="box hot" x="20" y="70" width="330" height="220" rx="16"/>
  <text class="n" x="40" y="98">YOUR BROWSER</text><text class="t" x="40" y="124">app.html (one file)</text>
  <text class="s" x="40" y="150">· wizard, brief, timed quiz, SRS trainer</text>
  <text class="s" x="40" y="170">· edge maths, streaks, progress</text>
  <text class="s" x="40" y="190">· files requests when it needs content</text>
  <text class="s" x="40" y="210">· polls every 3 s, updates itself</text>
  <text class="mono" x="40" y="250">http://127.0.0.1:4848</text>
  <!-- server -->
  <rect class="box" x="455" y="70" width="320" height="220" rx="16"/>
  <text class="n" x="475" y="98">LOCAL SERVER</text><text class="t" x="475" y="124">learn.py (Python, stdlib)</text>
  <text class="s" x="475" y="150">· serves the page + JSON API</text>
  <text class="s" x="475" y="170">· validates every agent response</text>
  <text class="s" x="475" y="190">· scores attempts, schedules SRS</text>
  <text class="s" x="475" y="210">· CLI: pending · fulfil · status · export</text>
  <text class="mono" x="475" y="250">~/.gh-learn/topics/&lt;slug&gt;/topic.json</text>
  <text class="mono" x="475" y="268">~/.gh-learn/requests/*.json</text>
  <!-- agent -->
  <rect class="box warm" x="900" y="70" width="320" height="220" rx="16"/>
  <text class="n" x="920" y="98" fill="#b45309">YOUR AI AGENT</text><text class="t" x="920" y="124">Claude Code · Codex · Copilot CLI</text>
  <text class="s" x="920" y="150">· reads SKILL.md, loops on `pending`</text>
  <text class="s" x="920" y="170">· writes brief · categories · questions</text>
  <text class="s" x="920" y="190">· diagnoses misses → training protocol</text>
  <text class="s" x="920" y="210">· optional web search for fresh news</text>
  <text class="mono" x="920" y="250">learn.py fulfil &lt;id&gt; answer.json</text>
  <!-- arrows -->
  <path class="l" d="M350 150 L455 150"/><text class="lab" x="402" y="138" font-size="11" text-anchor="middle">GET /api · POST</text>
  <path class="l" d="M455 200 L350 200"/><text class="lab" x="402" y="222" font-size="11" text-anchor="middle">topic.json → render</text>
  <path class="l" d="M900 150 L775 150"/><text class="lab" x="837" y="138" font-size="11" text-anchor="middle">fulfil (validated JSON)</text>
  <path class="l" d="M775 200 L900 200"/><text class="lab" x="837" y="222" font-size="11" text-anchor="middle">pending → request</text>
  <text class="s" x="20" y="330">No API key: the skill uses the agent subscription you already have. The brief states its as_of date and whether the web was checked.</text>
</svg>
